name: TAHI-X optional FastLanes probe

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'native/fastlanes_probe/**'
      - 'docs/fastlanes.md'
      - '.github/workflows/tahi-x-fastlanes.yml'
  pull_request:
    paths:
      - 'native/fastlanes_probe/**'
      - 'docs/fastlanes.md'
      - '.github/workflows/tahi-x-fastlanes.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cwida/FastLanes
          path: external/FastLanes
          ref: 6c2e8df38519b479a1e3d5496b765b40538de52d
      - name: Configure probe
        run: cmake -S native/fastlanes_probe -B build/fastlanes -DFASTLANES_DIR=$GITHUB_WORKSPACE/external/FastLanes
      - name: Build probe
        run: cmake --build build/fastlanes
      - name: Run probe
        run: ./build/fastlanes/tahi_fastlanes_probe
