name: TAHI-X optional FastLanes probe

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'native/fastlanes_probe/**'
      - 'docs/fastlanes.md'
      - '.github/workflows/tahi-x-fastlanes.yml'
  pull_request:
    paths:
      - 'native/fastlanes_probe/**'
      - 'docs/fastlanes.md'
      - '.github/workflows/tahi-x-fastlanes.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cwida/FastLanes
          path: external/FastLanes
          ref: main
      - name: Configure probe
        run: cmake -S native/fastlanes_probe -B build/fastlanes -DFASTLANES_DIR=$GITHUB_WORKSPACE/external/FastLanes --trace-expand
      - name: List CMake targets
        run: cmake --build build/fastlanes --target help
      - name: Build probe
        run: cmake --build build/fastlanes --verbose
      - name: Run probe
        run: ./build/fastlanes/tahi_fastlanes_probe
