name: TAHI-X reference tests

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'tahi_x/**'
      - 'tests/tahi_x/**'
      - 'pyproject.toml'
      - '.github/workflows/tahi-x-reference.yml'
  pull_request:
    paths:
      - 'tahi_x/**'
      - 'tests/tahi_x/**'
      - 'pyproject.toml'
      - '.github/workflows/tahi-x-reference.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run TAHI-X reference tests
        run: python -m pytest -q tests/tahi_x/reference
